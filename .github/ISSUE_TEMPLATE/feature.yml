name: Feature request
description: Propose a measurable capability or workflow improvement.
title: '[Feature]: '
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision or workflow is difficult today? Describe the need before the solution.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Deployment scope
      options:
        - Individual developer
        - Team or multi-root workspace
        - Enterprise fleet
        - All scopes
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include inputs, outputs, and how a user would know it worked.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and provenance impact
      description: State any new data read, retained, exported, or estimated.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
