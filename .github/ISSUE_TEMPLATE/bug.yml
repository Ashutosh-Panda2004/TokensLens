name: Bug report
description: Report a reproducible TokenLens defect using synthetic or redacted data.
title: '[Bug]: '
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not include prompts, completions, real journals, access tokens, private paths, session IDs, or organisation data. Report vulnerabilities through the private security link below.
  - type: input
    id: version
    attributes:
      label: TokenLens version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI or core library
        - Local dashboard
        - VS Code extension
        - Runtime hooks or MCP
        - Policy or organisation workflow
        - Packaging or documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, VS Code version, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps and synthetic fixture data where needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, prompts, completions, private paths, raw IDs, and organisation data.
          required: true
        - label: This is not a security vulnerability or suspected data exposure.
          required: true
