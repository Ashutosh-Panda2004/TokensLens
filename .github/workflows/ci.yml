name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        if: matrix.node-version == '22.x'
        run: npm run audit:production

      - name: Check formatting
        run: npm run format:check

      # The VS Code package typechecks and lints against core's *built*
      # declarations (packages/core/dist) by design — see the comment in
      # packages/vscode/tsconfig.json. On a fresh checkout that directory
      # does not exist yet, so core must be built before the type-aware
      # lint and typecheck steps can resolve it.
      - name: Build core (declarations for workspace consumers)
        run: npm run build -w @tokenslens/core

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify release metadata
        run: npm run verify:release

      - name: Hook performance gate
        run: npm run test:performance -w @tokenslens/core

      - name: Test with coverage
        run: npm run test:coverage

  package-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Verify release metadata
        run: npm run verify:release

      - name: Package extension
        run: npm run package -w tokenlens-vscode -- --out ../../tokenlens-vscode-ci.vsix
