name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package versions
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          node -e "const fs=require('node:fs'); const expected=process.argv[1]; for (const file of ['package.json','packages/core/package.json','packages/vscode/package.json']) { const actual=JSON.parse(fs.readFileSync(file,'utf8')).version; if (actual !== expected) throw new Error(file + ' is ' + actual + ', expected ' + expected); }" "$VERSION"
          node -e "const fs=require('node:fs'); const core=JSON.parse(fs.readFileSync('packages/core/package.json','utf8')); const extension=JSON.parse(fs.readFileSync('packages/vscode/package.json','utf8')); if (core.name !== '@tokenslens/core') throw new Error('Unexpected core package: ' + core.name); if (extension.name !== 'tokenlens-vscode') throw new Error('Unexpected extension package: ' + extension.name);"

      - name: Quality gate
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm run format:check
          npm run lint
          npm run typecheck
          npm run audit:production
          npm run build
          npm run verify:release -- "$VERSION"
          npm test

      - name: Build release artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          VERSION="${GITHUB_REF_NAME#v}"
          npm pack --workspace @tokenslens/core --pack-destination artifacts
          npm run package --workspace tokenlens-vscode -- --out "../../artifacts/tokenlens-vscode-${VERSION}.vsix"
          npm sbom --workspace @tokenslens/core --sbom-format cyclonedx > artifacts/tokenlens-core.cdx.json
          (cd artifacts && sha256sum *.tgz *.vsix *.json > SHA256SUMS.txt)

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --title "TokenLens $GITHUB_REF_NAME"
