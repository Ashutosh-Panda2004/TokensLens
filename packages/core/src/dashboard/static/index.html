<!doctype html>
<html lang="en" data-theme="system" data-density="comfortable" data-nav="expanded">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TokenLens — Credit Ledger</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="tl-skip" href="#view">Skip to content</a>

    <div class="tl-shell">
      <aside class="tl-sidebar" id="sidebar">
        <div class="tl-sidebar-head">
          <span class="tl-logo" aria-hidden="true">◑</span>
          <span class="tl-wordmark">TokenLens</span>
          <button
            type="button"
            id="nav-toggle"
            class="tl-nav-toggle"
            aria-expanded="true"
            aria-controls="sidebar"
            title="Collapse navigation (Ctrl+B)"
          >
            ‹
          </button>
        </div>
        <nav class="tl-nav" id="nav" aria-label="Views"></nav>
        <div class="tl-sidebar-foot">
          <button type="button" id="theme-toggle" class="tl-side-button">
            <span class="tl-side-icon" aria-hidden="true">◐</span>
            <span class="tl-side-text">Theme: system</span>
          </button>
          <button type="button" id="density-toggle" class="tl-side-button">
            <span class="tl-side-icon" aria-hidden="true">≡</span>
            <span class="tl-side-text">Compact</span>
          </button>
        </div>
      </aside>

      <button
        type="button"
        id="nav-backdrop"
        class="tl-nav-backdrop"
        aria-label="Close navigation"
        aria-hidden="true"
        tabindex="-1"
      ></button>

      <div class="tl-body">
        <header class="tl-topbar">
          <button
            type="button"
            id="nav-open"
            class="tl-icon-button tl-nav-open"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            ☰
          </button>

          <div class="tl-crumb">
            <h1 id="view-title">Overview</h1>
            <p class="tl-scope-line" id="scope-line" role="status"></p>
          </div>

          <div class="tl-topbar-controls">
            <select id="scope-select" aria-label="Scope" class="tl-select"></select>
            <select id="range-select" aria-label="Date range" class="tl-select">
              <option value="all">All time</option>
              <option value="7">Last 7 days</option>
              <option value="30">Last 30 days</option>
              <option value="mtd">Month to date</option>
              <option value="90">Last 90 days</option>
              <option value="custom">Custom…</option>
            </select>
            <span class="tl-custom-range" id="custom-range" hidden>
              <input type="date" id="range-from" aria-label="Range start" />
              <span aria-hidden="true">→</span>
              <input type="date" id="range-to" aria-label="Range end" />
            </span>
            <button type="button" id="refresh" class="tl-icon-button" title="Refresh">⟳</button>
          </div>
        </header>

        <main id="view" tabindex="-1">
          <p class="tl-loading">Loading…</p>
        </main>

        <footer class="tl-footer">
          <span><span class="tl-chip tl-chip-measured">measured</span> from a recorded value</span>
          <span
            ><span class="tl-chip tl-chip-blended">~N%</span> part measured, part estimated</span
          >
          <span><span class="tl-chip tl-chip-modelled">modelled</span> rate-card estimate</span>
          <span id="updated-at"></span>
          <span>UTC days</span>
          <span><kbd>Ctrl</kbd>+<kbd>K</kbd> jump · <kbd>Ctrl</kbd>+<kbd>B</kbd> nav</span>
        </footer>
      </div>
    </div>

    <div
      id="palette"
      class="tl-palette"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Command palette"
    >
      <div class="tl-palette-box">
        <input
          type="text"
          id="palette-input"
          placeholder="Jump to a view…"
          aria-label="Jump to a view"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="palette-list"
          aria-expanded="false"
        />
        <ul id="palette-list" role="listbox"></ul>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
